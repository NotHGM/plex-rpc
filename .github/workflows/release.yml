name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # go-winres reads the version from the tag

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Test
        run: go test ./...

      - name: Embed icon and version info
        run: go generate ./cmd/plex-rpc

      - name: Build
        env:
          VERSION: ${{ github.ref_name }}
          CLIENT_ID: ${{ vars.DISCORD_CLIENT_ID }}
        run: |
          mkdir dist
          for arch in amd64 arm64; do
            GOOS=windows GOARCH=$arch CGO_ENABLED=0 go build -trimpath \
              -ldflags "-H windowsgui -s -w -X main.version=$VERSION -X main.defaultClientID=$CLIENT_ID" \
              -o dist/plex-rpc-windows-$arch.exe ./cmd/plex-rpc
          done
          cd dist && sha256sum *.exe > SHA256SUMS.txt

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
